[package]
name = "heic_webp_converter"
version = "0.1.0"
edition = "2024"
description = "Batch convert HEIC, WebP and AVIF photos to JPG or PNG, offline."
repository = "https://github.com/fredle/heic-webp-converter"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
velopack = "1.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
